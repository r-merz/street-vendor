<!-- Single parent page for both pygbag game and blockly workspace -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Street Vendor Coding Mode</title>
        <style>
            html, 
            body{
                margin: 0; 
                width: 100%; 
                height: 100%; 
                overflow: hidden; 
                font-family: Arial, sans-serif; 
            }
            #container{
                display: flex; 
                width: 100%; 
                height: 100vh;
            }
            .panel{
                flex: 1; 
                border: none; 
            }
            #gameFrame{
                width: 50%; 
            }
            #blocklyFrame{
                width: 50%
            }
        </style>
    </head>
    <body>
        <div id="container">
            <iframe 
                id="gameFrame"
                class="panel"
                src="./">
            </iframe>
            <iframe
                id="blocklyFrame"
                class="panel"
                src="./blockly/">
            </iframe>
        </div>
    </body>
</html>
