name: Build and Deploy Street Vendor

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag==0.9.3

      - name: Build Pygame web version
        run: pygbag --build --disable-sound-format-error .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: blockly/package-lock.json

      - name: Install Blockly dependencies
        working-directory: blockly
        run: npm ci

      - name: Build Blockly editor
        working-directory: blockly
        run: npm run build

      - name: Copy Blockly build into Pygbag site
        run: |
          mkdir -p build/web/blockly
          cp -R blockly/dist/* build/web/blockly/
      - name: Combined page
        run: cp combined.html build/web/combined.html 
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4