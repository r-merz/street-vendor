<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Street Vendor Blockly</title>
    <style>
        html, 
        body{
            margin: 0; 
            width: 100%; 
            height: 100%; 
            font-family: Arial, sans-serif; 
        }
        body{
            display: flex; 
            flex-direction: column; 
        }
        header{
            padding: 12px 20px; 
            background: #eee; 
        }
        #blocklyDiv {
            flex: 1; 
            width: 100%; 
        }
        #controls{
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 8px 20px; 
            background: #f5f5f5; 
            border-bottom: 1px solid #ccc;
        }
        /* Make run button a small green triangle  */
        #runButton { 
            width: 42px; 
            height: 42px; 
            padding: 0; 
            border: none; 
            border-radius: 8px; 
            background: #35a853; 
            color: white;
            font-size: 22px; 
            cursor: pointer; 
        }
        #runButton:hover{
            background: #2d9147;
        }
        #commandOutput{
            padding: 8px 12px; 
            background: white; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: monospace; 
            font-size: 15px; 
        }
        /* Make triangle look like a game play button */
        .playIcon{
            display: inline-block; 
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent; 
            border-bottom: 8px solid transparent; 
            border-left: 13px solid white; 
            margin-left: 3px; 
        }
    </style>
</head>
<body>
    <header>
        <h2>Street Vendor Block Editor</h2>
    </header>
    <div id="controls">
        <button id="runButton" title="Run Program">
            <span class="playIcon"></span>
        </button>
        <!-- Generated commands list -->
        <div id="commandOutput"> 
            Commands: []
        </div>
    </div>
    <div id="blocklyDiv"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
